services:
  db:
    image: postgres:16
    container_name: emopet-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-emopet}
      POSTGRES_USER: ${DB_USER:-emopet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in a local env file}
    ports:
      - "5432:5432"
    volumes:
      - emopet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-emopet} -d ${DB_NAME:-emopet}"]
      interval: 5s
      timeout: 3s
      retries: 20

# P0 runtime reconciliation:
# - Compose currently provides local PostgreSQL infrastructure only.
# - The active API runtime is the TypeScript/Hono workspace under backend/.
# - No API container is declared until a reviewed Node/Hono Dockerfile and
#   deployment contract are added in a separate controlled change.
# - Database migrations are intentionally not run by Compose because the
#   checked-in Drizzle migration baseline is still an OPEN/BLOCKED gate.

volumes:
  emopet_pg:

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="EMOPET TAG"
CONFIG_BT_DEVICE_APPEARANCE=0

CONFIG_ENTROPY_GENERATOR=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=2048

# DEVICE-TRUST-ID-09 source candidate: PSA ECDSA P-256 signing only.
# Key generation/storage/provisioning remains a separate authority.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y


# DEVICE-TRUST-ID-10 remains source-only until #657 target evidence exists.
# Intentionally NOT enabled here:
# CONFIG_EMOPET_DEVICE_KEY_PROVISIONING
# CONFIG_SECURE_STORAGE
# CONFIG_HW_UNIQUE_KEY
# CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_KEY_PROVIDER_HUK_LIBRARY

packages:
  - "packages/*"
  - "apps/*"
  - "backend"
  - "tools/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Exact provenance-gap exceptions used only while regenerating this controlled
# lock baseline. semver@6.3.1 is the known permanent legacy Babel exception.
# The other exact versions below already exist in the pre-INT-01 lockfile and
# are admitted only so pnpm can re-resolve that controlled graph; they will be
# removed again after the lockfile is regenerated.
trustPolicyExclude:
  - semver@6.3.1
  - semver@5.7.2
  - undici-types@6.21.0
  - eslint-import-resolver-typescript@3.10.1
  - ua-parser-js@1.0.41
minimumReleaseAgeExclude:
  - fast-uri@3.1.7
  - browserslist@4.28.7
overrides:
  shell-quote: 1.9.0
  tar: 7.5.21
  postcss: 8.5.23
  "@xmldom/xmldom": 0.8.15
  fast-uri: 3.1.7
  browserslist: 4.28.7
  "brace-expansion@>=1.0.0 <2.0.0": 1.1.18
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.4
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.9
  "nanoid@>=3.0.0 <4.0.0": 3.3.18
  "nanoid@>=5.0.0 <6.0.0": 5.1.16
  "sharp@>=0.34.0 <0.35.0": 0.35.4
  vite: 6.4.3
  "ws@>=8.0.0 <8.21.0": 8.21.0
  "ws@>=7.0.0 <7.5.11": 7.5.11
  "ws@>=6.0.0 <6.2.4": 6.2.4
  undici: 6.27.0
  "form-data@>=3.0.0 <3.0.5": 3.0.5
  js-yaml: 4.3.2
  "@babel/plugin-transform-modules-systemjs": 7.29.4
  "@babel/core": 7.29.7
  "uuid@<11.1.1": 11.1.1

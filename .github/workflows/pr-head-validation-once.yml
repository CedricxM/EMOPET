name: PR head validation (one shot)

on:
  push:
    branches:
      - experience-hardening-2026-09-06

permissions:
  contents: read

concurrency:
  group: pr-head-validation-once-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  core-security:
    name: Core regression + authority + dependency gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install exact locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Run workspace tests
        run: pnpm test
      - name: Build web application
        run: pnpm --filter @emopet/web build
      - name: Enforce third-party data rights gate
        run: pnpm rights:audit
      - name: Enforce professional sharing authority gate
        run: pnpm professional-share:audit
      - name: Capture dependency audit evidence
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=high --json > pnpm-audit.json
          set -e
      - name: Enforce high/critical dependency gate
        run: node tools/security/evaluate-pnpm-audit.mjs pnpm-audit.json
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr224-pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error
          retention-days: 14

  static-security:
    name: Semgrep + secrets + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.175.0'
      - name: Run Semgrep security analysis
        run: semgrep scan --config p/ci --error --metrics=off --json --output semgrep.json .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload static-security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr224-static-security-evidence
          path: |
            semgrep.json
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14

  p0-db:
    name: P0 DB disposable baseline validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: emopet_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d emopet_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa
      PGPASSWORD: emopet_qa_only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Enable Corepack
        run: corepack enable
      - name: Setup pnpm
        run: corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Repository-only migration checks
        working-directory: backend
        run: node --test test/migration-baseline-static.test.mjs
      - name: Apply draft prerequisites and historical migrations
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done < <(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort)
          while IFS= read -r file; do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done < <(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort)
      - name: Capture first schema
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" > /tmp/schema-a.sql
          psql "$DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-a.txt
      - name: Repeat complete apply on second database
        env:
          REPEAT_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_repeat
        shell: bash
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_qa_repeat
          while IFS= read -r file; do
            psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done < <(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort)
          while IFS= read -r file; do
            psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done < <(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          pg_dump --schema-only --no-owner --no-privileges "$REPEAT_DATABASE_URL" > /tmp/schema-b.sql
          psql "$REPEAT_DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-b.txt
      - name: Compare repeatable schema
        run: |
          diff -u /tmp/tables-a.txt /tmp/tables-b.txt
          sed -i '/^\\restrict /d;/^\\unrestrict /d' /tmp/schema-a.sql
          sed -i '/^\\restrict /d;/^\\unrestrict /d' /tmp/schema-b.sql
          diff -u /tmp/schema-a.sql /tmp/schema-b.sql
      - name: Build backend dependency closure
        run: pnpm --filter @emopet/api... build
      - name: Generate isolated Drizzle fresh baseline
        working-directory: backend
        run: |
          rm -rf db/p0-generated-baseline
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_fresh_baseline
          test -f db/p0-generated-baseline/meta/_journal.json
          test "$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 1
      - name: Check generated Drizzle ledger
        working-directory: backend
        run: pnpm exec drizzle-kit check --config=db/drizzle.p0-baseline.config.ts
      - name: Apply generated baseline and compare inventory
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_qa_generated
          pnpm exec drizzle-kit migrate --config=db/drizzle.p0-baseline.config.ts
          psql "$DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-generated.txt
          diff -u /tmp/tables-a.txt /tmp/tables-generated.txt
      - name: Verify generated snapshot is stable
        working-directory: backend
        run: |
          before="$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)"
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_second_generation_check
          after="$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$before" -eq "$after"
      - name: Backend typecheck
        run: pnpm --filter @emopet/api typecheck
      - name: Backend tests
        run: pnpm --filter @emopet/api test
      - name: Upload generated baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr224-p0-generated-drizzle-baseline
          path: backend/db/p0-generated-baseline
          if-no-files-found: warn
          retention-days: 14

  cleanup:
    name: Retire one-shot workflow after green validation
    needs: [core-security, static-security, p0-db]
    if: ${{ always() && needs.core-security.result == 'success' && needs.static-security.result == 'success' && needs.p0-db.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: experience-hardening-2026-09-06
          persist-credentials: true
      - name: Remove one-shot validator from branch
        shell: bash
        run: |
          rm .github/workflows/pr-head-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-head-validation-once.yml
          git commit -m "ci: retire one-shot PR head validator"
          git push origin HEAD:experience-hardening-2026-09-06

name: Owner terminology guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  owner-terminology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce active Owner vocabulary
        run: node scripts/control/owner-terminology-audit.mjs

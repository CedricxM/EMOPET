name: Owner terminology guard

on:
  pull_request:
  push:
    branches: [main]

# For pull requests, keep only the newest run for this workflow.
# Pushes to main and manual runs remain non-cancelling evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  owner-terminology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce active Owner vocabulary
        run: node scripts/control/owner-terminology-audit.mjs

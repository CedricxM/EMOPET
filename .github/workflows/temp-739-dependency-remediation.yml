name: TEMP #739 dependency remediation

on:
  push:
    branches:
      - security/remediate-2026-09-30-high-advisories-739
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Regenerate lockfile from controlled overrides
        run: pnpm install --lockfile-only

      - name: Reject unrelated generated changes
        shell: bash
        run: |
          unexpected="$(git status --porcelain | grep -vE '^[ MARC?]{2} pnpm-lock\.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files changed during lock regeneration:"
            echo "$unexpected"
            exit 1
          fi
          git diff -- pnpm-lock.yaml

      - name: Install exact regenerated graph
        run: pnpm install --frozen-lockfile

      - name: Audit regenerated graph
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=high --json > pnpm-audit-739.json
          set -e
          node tools/security/evaluate-pnpm-audit.mjs pnpm-audit-739.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @emopet/web build

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml did not change"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): regenerate lock for #739 advisories"
          git push origin HEAD:security/remediate-2026-09-30-high-advisories-739

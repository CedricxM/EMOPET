name: MAT Phase 0A validation

on:
  pull_request:
    paths:
      - '.github/workflows/mat-phase0a-validation.yml'
      - 'config/validation/mat-phase0a-evidence-contract-v1.json'
      - 'docs/validation/templates/MAT_PHASE0A_*.csv'
      - 'scripts/control/mat-phase0a-evidence-contract.test.mjs'
      - 'scripts/validation/mat-phase0a-evidence-ingest.mjs'
      - 'scripts/validation/mat-phase0a-evidence-ingest.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mat-phase0a-validation.yml'
      - 'config/validation/mat-phase0a-evidence-contract-v1.json'
      - 'docs/validation/templates/MAT_PHASE0A_*.csv'
      - 'scripts/control/mat-phase0a-evidence-contract.test.mjs'
      - 'scripts/validation/mat-phase0a-evidence-ingest.mjs'
      - 'scripts/validation/mat-phase0a-evidence-ingest.test.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Validate MAT Phase 0A evidence contract and ingest
        run: >-
          node --test
          scripts/control/mat-phase0a-evidence-contract.test.mjs
          scripts/validation/mat-phase0a-evidence-ingest.test.mjs

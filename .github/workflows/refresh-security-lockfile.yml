name: Temporary security lockfile refresh

on:
  push:
    branches:
      - experience-hardening-2026-09-06

permissions:
  contents: write

concurrency:
  group: refresh-security-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.repository == 'CedricxM/EMOPET' && github.ref == 'refs/heads/experience-hardening-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: experience-hardening-2026-09-06
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate lockfile from patched overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify regenerated lockfile is installable
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches the patched overrides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security: refresh lockfile for patched transitive deps"
          git push origin HEAD:experience-hardening-2026-09-06

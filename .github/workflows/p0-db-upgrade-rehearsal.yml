name: P0 DB upgrade rehearsal

on:
  pull_request:
    paths:
      - 'backend/db/baseline-draft/**'
      - 'backend/db/migrations/**'
      - 'backend/test/migration-0012-upgrade-seed.sql'
      - 'backend/test/migration-0012-upgrade-postcheck.sql'
      - 'backend/test/migration-0013-eli-identity-seed.sql'
      - 'backend/test/migration-0013-eli-identity-postcheck.sql'
      - 'backend/test/migration-full-chain-core-seed.sql'
      - 'backend/test/migration-full-chain-core-postcheck.sql'
      - '.github/workflows/p0-db-upgrade-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-0012-populated-upgrade:
    name: Populated 0011 -> 0012 PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: emopet_qa_only
      UPGRADE_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_upgrade_0012

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create populated N-1 rehearsal database
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_upgrade_0012

          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying prerequisite $file"
            psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

          reached_target=0
          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            if [ "$(basename "$file")" = '0012_sensor_summary_device_provenance.sql' ]; then
              reached_target=1
              break
            fi
            echo "Applying pre-0012 migration $file"
            psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          test "$reached_target" -eq 1

          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/migration-0012-upgrade-seed.sql

      - name: Apply 0012 over populated N-1 database
        run: psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0012_sensor_summary_device_provenance.sql

      - name: Verify legacy row preservation and new constraints
        run: psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/migration-0012-upgrade-postcheck.sql

      - name: Maturity boundary
        if: always()
        run: |
          echo 'This job proves only the disposable PostgreSQL 0011 -> 0012 transition exercised here.'
          echo 'It does not authorize production migration, prove every historical/future upgrade path, or replace backup/rollback/staging rehearsal.'

  migration-0013-eli-identity-upgrade:
    name: Populated 0012 -> 0013 ELI identity rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: emopet_qa_only
      UPGRADE_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_upgrade_0013
      REJECT_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_upgrade_0013_reject

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create populated canonical N-1 database
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_upgrade_0013

          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying prerequisite $file"
            psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

          reached_target=0
          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            if [ "$(basename "$file")" = '0013_eli_canonical_identity.sql' ]; then
              reached_target=1
              break
            fi
            echo "Applying pre-0013 migration $file"
            psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          test "$reached_target" -eq 1

          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/migration-0013-eli-identity-seed.sql

      - name: Apply 0013 over canonical populated legacy ELI rows
        run: psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0013_eli_canonical_identity.sql

      - name: Verify ELI rows, UUID types and canonical FKs
        run: psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/migration-0013-eli-identity-postcheck.sql

      - name: Build rejection database through 0012
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_upgrade_0013_reject

          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            if [ "$(basename "$file")" = '0013_eli_canonical_identity.sql' ]; then
              break
            fi
            psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Reject non-UUID legacy identity without partial mutation
        run: |
          psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO dog_sub_baselines (dog_id, slot) VALUES ('legacy-dog', 'deep_rest_mat')"

          if psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0013_eli_canonical_identity.sql; then
            echo '0013 unexpectedly accepted a non-UUID legacy dog identity' >&2
            exit 1
          fi

          psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE actual_type text;
          BEGIN
            SELECT data_type INTO actual_type
              FROM information_schema.columns
             WHERE table_schema='public' AND table_name='dog_sub_baselines' AND column_name='dog_id';
            IF actual_type IS DISTINCT FROM 'text' THEN
              RAISE EXCEPTION 'failed 0013 attempt partially mutated dog_id type to %', actual_type;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM dog_sub_baselines WHERE dog_id='legacy-dog') THEN
              RAISE EXCEPTION 'failed 0013 attempt lost the rejected legacy row';
            END IF;
          END $$;
          SQL

      - name: Reject orphan canonical-looking UUID without partial mutation
        run: |
          psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM dog_sub_baselines WHERE dog_id='legacy-dog';
          INSERT INTO dog_sub_baselines (dog_id, slot)
          VALUES ('71000000-0000-4000-8000-000000009999', 'deep_rest_mat');
          SQL

          if psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0013_eli_canonical_identity.sql; then
            echo '0013 unexpectedly accepted an orphan UUID dog identity' >&2
            exit 1
          fi

          psql "$REJECT_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE actual_type text;
          BEGIN
            SELECT data_type INTO actual_type
              FROM information_schema.columns
             WHERE table_schema='public' AND table_name='dog_sub_baselines' AND column_name='dog_id';
            IF actual_type IS DISTINCT FROM 'text' THEN
              RAISE EXCEPTION 'orphan rejection partially mutated dog_id type to %', actual_type;
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM dog_sub_baselines
               WHERE dog_id='71000000-0000-4000-8000-000000009999'
            ) THEN
              RAISE EXCEPTION 'orphan rejection lost the rejected legacy row';
            END IF;
          END $$;
          SQL

      - name: Maturity boundary
        if: always()
        run: |
          echo 'This job proves only the disposable 0012 -> 0013 ELI shared-identity transition and its fail-closed validation behavior.'
          echo 'It deliberately refuses non-UUID or orphan legacy identifiers instead of inventing mappings.'
          echo 'It does not authorize a production migration or define remediation for real invalid production data.'

  full-chain-populated-core-upgrade:
    name: Populated core -> current historical chain rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: emopet_qa_only
      FULL_CHAIN_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_upgrade_full_chain

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build populated reconstructed core before migration 0001
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_upgrade_full_chain

          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying prerequisite $file"
            psql "$FULL_CHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

          psql "$FULL_CHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/migration-full-chain-core-seed.sql

      - name: Apply complete historical migration chain over populated core
        run: |
          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$FULL_CHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Verify populated core survived through current schema
        run: psql "$FULL_CHAIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/migration-full-chain-core-postcheck.sql

      - name: Maturity boundary
        if: always()
        run: |
          echo 'This job proves representative core rows survive the reconstructed pre-0001 baseline through the complete checked-in migration chain.'
          echo 'It is not evidence from a real production dump and does not replace staging, backup/restore, rollback, lock-time or operator-runbook validation.'

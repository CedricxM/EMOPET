name: One-shot browserslist lock remediation

on:
  push:
    branches:
      - fix/security-browserslist-4-28-7

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/security-browserslist-4-28-7
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate exact pnpm
        run: |
          corepack prepare pnpm@10.33.0 --activate
          test "$(pnpm --version)" = "10.33.0"

      - name: Regenerate lockfile with bounded exact temporary trust exclusions
        run: |
          cp pnpm-workspace.yaml /tmp/pnpm-workspace.yaml.controlled
          trap 'cp /tmp/pnpm-workspace.yaml.controlled pnpm-workspace.yaml' EXIT
          cat >> pnpm-workspace.yaml <<'EOF'
          trustPolicyExclude:
            - undici-types@6.21.0
            - eslint-import-resolver-typescript@3.10.1
            - ua-parser-js@1.0.41
            - semver@6.3.1
          EOF
          pnpm install --lockfile-only

      - name: Verify policy restoration and unchanged pre-existing trust packages
        run: |
          git diff --exit-code -- pnpm-workspace.yaml
          grep -q "undici-types@6.21.0:" pnpm-lock.yaml
          grep -q "sha512-iwDZqg0QAGrg9Rav5H4n0M64c3mkR59cJ6wQp+7C4nI0gsmExaedaYLNO44eT4AtBBwjbTiGPMlt2Md0T9H9JQ==" pnpm-lock.yaml
          grep -q "eslint-import-resolver-typescript@3.10.1:" pnpm-lock.yaml
          grep -q "sha512-A1rHYb06zjMGAxdLSkN2fXPBwuSaQ0iO5M/hdyS0Ajj1VBaRp0sPD3dn1FhME3c/JluGFbwSxyCfqdSbtQLAHQ==" pnpm-lock.yaml
          grep -q "ua-parser-js@1.0.41:" pnpm-lock.yaml
          grep -q "sha512-LbBDqdIC5s8iROCUjMbW1f5dJQTEFB1+KO9ogbvlb3nm9n4YHa5p4KTvFPWvh2Hs8gZMBuiB1/8+pdfe/tDPug==" pnpm-lock.yaml
          grep -q "semver@6.3.1:" pnpm-lock.yaml
          grep -q "sha512-BR7VvDCVHO+q2xBEWskxS6DJE1qRnb7DxzUrogb71CWoSficBxYsiAGd+Kl0mmq/MprG9yArRkyrQxTO6XjMzA==" pnpm-lock.yaml

      - name: Verify patched resolution under normal repository policy
        run: |
          pnpm install --frozen-lockfile
          pnpm why browserslist
          grep -q "browserslist@4.28.7" pnpm-lock.yaml

      - name: Enforce high and critical dependency audit
        run: pnpm audit --audit-level=high

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run workspace tests
        run: pnpm test

      - name: Build web application
        run: pnpm web:build

      - name: Commit regenerated lockfile only after all gates pass
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Expected pnpm-lock.yaml to change but no diff was produced."
            exit 1
          fi
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): regenerate lock for browserslist 4.28.7"
          git push origin HEAD:fix/security-browserslist-4-28-7

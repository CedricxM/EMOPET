name: One-shot browserslist lock remediation

on:
  push:
    branches:
      - fix/security-browserslist-4-28-7

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/security-browserslist-4-28-7
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate exact pnpm
        run: |
          corepack prepare pnpm@10.33.0 --activate
          test "$(pnpm --version)" = "10.33.0"

      - name: Regenerate lockfile from controlled override
        run: pnpm install --lockfile-only

      - name: Verify patched resolution
        run: |
          pnpm install --frozen-lockfile
          pnpm why browserslist
          grep -q "browserslist@4.28.7" pnpm-lock.yaml

      - name: Enforce high and critical dependency audit
        run: pnpm audit --audit-level=high

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run workspace tests
        run: pnpm test

      - name: Build web application
        run: pnpm web:build

      - name: Commit regenerated lockfile only after all gates pass
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Expected pnpm-lock.yaml to change but no diff was produced."
            exit 1
          fi
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): regenerate lock for browserslist 4.28.7"
          git push origin HEAD:fix/security-browserslist-4-28-7

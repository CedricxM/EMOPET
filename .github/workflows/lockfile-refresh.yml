name: Temporary lockfile refresh

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Temporarily disable trust re-evaluation for deterministic lock refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pnpm-workspace.yaml')
          lines = path.read_text().splitlines()
          output = []
          skipping_excludes = False
          for line in lines:
              if line.startswith('trustPolicy:'):
                  continue
              if line.startswith('trustPolicyExclude:'):
                  skipping_excludes = True
                  continue
              if skipping_excludes and line.startswith('  - '):
                  continue
              if skipping_excludes:
                  skipping_excludes = False
              output.append(line)
          path.write_text('\n'.join(output) + '\n')
          PY
      - name: Regenerate lockfile from controlled workspace overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Restore committed trust policy before artifact upload
        if: always()
        run: git checkout -- pnpm-workspace.yaml
      - name: Upload regenerated lockfile
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

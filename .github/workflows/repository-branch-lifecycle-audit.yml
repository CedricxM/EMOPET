name: Repository branch lifecycle audit

on:
  pull_request:
    paths:
      - 'scripts/repository/branch-lifecycle-audit.mjs'
      - 'tests/repository/branch-lifecycle-audit.test.mjs'
      - 'config/repository/branch-lifecycle-hard-exclusions-v1.json'
      - 'docs/control/REPOSITORY_BRANCH_LIFECYCLE_AUDIT.md'
      - '.github/workflows/repository-branch-lifecycle-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-lifecycle-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Test read-only branch lifecycle audit
        run: node --test tests/repository/branch-lifecycle-audit.test.mjs

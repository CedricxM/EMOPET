name: INT-01 controlled lockfile refresh

on:
  push:
    branches:
      - security/int01-repository-safety-2026-09-16
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/int01-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/int01-repository-safety-2026-09-16
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Regenerate lockfile from controlled workspace overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Assert refresh changed only pnpm-lock.yaml
        shell: bash
        run: |
          changed="$(git status --short | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo "No lockfile change produced."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -v '^pnpm-lock.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during controlled lock refresh:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit regenerated lockfile to INT-01 branch
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches the controlled overrides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security: regenerate INT-01 lockfile"
          git push origin HEAD:security/int01-repository-safety-2026-09-16

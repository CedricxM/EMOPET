name: P0 one-time remediation

on:
  push:
    branches:
      - emopet/p0-supply-chain

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Reconcile Bleiz v6 category handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/ai-personality/src/bleiz/bleiz-content-scheduler.ts')
          text = path.read_text()

          old_priority = "  behavior: 400,\n  nutrition: 340,"
          new_priority = "  behavior: 400,\n  behavior_education: 400,\n  nutrition: 340,"
          if old_priority not in text and new_priority not in text:
              raise SystemExit('CATEGORY_PRIORITY anchor not found')
          text = text.replace(old_priority, new_priority, 1)

          left_old = "personaProfile.favoredCategories.includes(left.template.category)"
          left_new = "personaProfile.favoredCategories.includes(left.template.category === 'behavior_education' ? 'behavior' : left.template.category)"
          right_old = "personaProfile.favoredCategories.includes(right.template.category)"
          right_new = "personaProfile.favoredCategories.includes(right.template.category === 'behavior_education' ? 'behavior' : right.template.category)"
          if left_old not in text and left_new not in text:
              raise SystemExit('left favored-category anchor not found')
          if right_old not in text and right_new not in text:
              raise SystemExit('right favored-category anchor not found')
          text = text.replace(left_old, left_new, 1)
          text = text.replace(right_old, right_new, 1)

          path.write_text(text)
      - name: Regenerate dependency lockfile reproducibly
        run: pnpm install --no-frozen-lockfile
      - name: Harden pnpm resolver policy
        shell: python
        run: |
          from pathlib import Path

          path = Path('pnpm-workspace.yaml')
          text = path.read_text()
          anchor = "allowBuilds:\n  esbuild: true\n  sharp: true\n  unrs-resolver: true\n"
          hardening = anchor + "minimumReleaseAge: 10080\nblockExoticSubdeps: true\ntrustPolicy: no-downgrade\n"
          if hardening not in text:
              if anchor not in text:
                  raise SystemExit('pnpm hardening anchor not found')
              text = text.replace(anchor, hardening, 1)
          path.write_text(text)
      - name: Verify hardened lockfile remains reproducible
        run: pnpm install --frozen-lockfile
      - name: Commit controlled remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-personality/src/bleiz/bleiz-content-scheduler.ts pnpm-workspace.yaml pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No remediation delta to commit.'
            exit 0
          fi
          git commit -m 'fix(security): reconcile lockfile and Bleiz v6 category'
          git push origin HEAD:emopet/p0-supply-chain

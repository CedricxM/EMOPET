name: Security supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# For pull requests, keep only the newest run for this workflow.
# Pushes to main and manual runs remain non-cancelling evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: pnpm
      - name: Install exact locked dependency graph
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test dependency licence evidence summarizer
        run: node --test scripts/security/summarize-pnpm-licenses.test.mjs
      - name: Test high/critical dependency gate evaluator
        run: node --test tools/security/evaluate-pnpm-audit.test.mjs
      - name: Collect exact-head dependency licence inventories
        run: |
          pnpm licenses list --json --long > pnpm-licenses-all.json
          pnpm licenses list --prod --json --long > pnpm-licenses-production.json
      - name: Summarize exact-head dependency licence evidence
        env:
          EMOPET_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/security/summarize-pnpm-licenses.mjs \
            pnpm-licenses-all.json \
            pnpm-licenses-production.json \
            pnpm-license-evidence.json \
            pnpm-license-summary.md
      - name: Upload dependency licence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-license-evidence
          path: |
            pnpm-licenses-all.json
            pnpm-licenses-production.json
            pnpm-license-evidence.json
            pnpm-license-summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Audit dependencies and preserve machine-readable evidence
        if: always()
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=high --json > pnpm-audit.json
          set -e
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error
      - name: Enforce high/critical dependency gate
        if: always()
        run: node tools/security/evaluate-pnpm-audit.mjs pnpm-audit.json

  security-regression:
    name: Dependency remediation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: pnpm
      - name: Restore Turbo and Next build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: emopet-security-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            emopet-security-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Enforce legacy freemium quarantine gate
        run: pnpm legacy-freemium:audit
      # Static, read-only repository guards. A PASS is not rights clearance,
      # scientific validation or runtime activation; each guard pins one
      # boundary that has already drifted or regressed once. See #114, #116,
      # #118 and #86.
      - name: Enforce CI coverage of every root scripts/ and tools/ test (#671)
        run: node --test scripts/control/control-test-ci-coverage.test.mjs
      - name: Enforce MAT Phase 0A evidence-ingestion contract (#230)
        run: pnpm validation:mat-phase0a:test
      - name: Test Bretagne schema evidence capture contract
        run: node --test scripts/data/capture-bretagne-open-data-schema.test.mjs
      - name: Test Bretagne RNR field review packet
        run: node --test scripts/data/bretagne-rnr-field-review-packet.test.mjs
      - name: Test Bretagne RNR field review response
        run: node --test scripts/data/bretagne-rnr-field-review-response.test.mjs
      - name: Test Bretagne RNR field review decision
        run: node --test scripts/data/bretagne-rnr-field-review-decision.test.mjs
      - name: Enforce Bretagne RNR licence clarification HOLD
        run: node --test scripts/control/bretagne-rnr-licence-clarification.test.mjs
      - name: Enforce Bretagne language-review outreach evidence
        run: node --test scripts/control/bretagne-language-review-outreach.test.mjs
      - name: Test Bretagne RNR licence clarification response flow
        run: node --test scripts/control/bretagne-rnr-licence-clarification-response.test.mjs
      - name: Enforce Company OS evidence-gated state invariants
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --test scripts/control/company-os-state.test.mjs
      - name: Generate review-only Company OS transition proposals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/control/propose-company-transitions.mjs --github-pr --output company-transition-proposals.json
      - name: Preserve Company OS transition proposals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: company-transition-proposals-${{ github.event.pull_request.head.sha || github.sha }}
          path: company-transition-proposals.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Unity World authority boundary (#567)
        run: node --test scripts/control/world-unity-authority-boundary.test.mjs
      - name: Enforce control-register pointers (#114, #116)
        run: |
          pnpm control:pointer-audit
          pnpm control:pointer-audit:test
      - name: Enforce mandatory scientific context pointers (C-BARQ / Penn / ELI)
        run: node --test scripts/control/mandatory-scientific-context.test.mjs
      - name: Enforce remaining repository control authorities
        run: >
          node --test
          scripts/control/activity-variability-authority.test.mjs
          scripts/control/breiz-territorial-rights-authority.test.mjs
          scripts/control/bretagne-canine-pilot-evidence.test.mjs
          scripts/control/eli-api-projection.test.mjs
          scripts/control/eli-dynamics-parameter-authority.test.mjs
          scripts/control/eli-proxy-evidence.test.mjs
          scripts/control/mat-incremental-value.test.mjs
          scripts/control/presence-comparison-authority.test.mjs
          scripts/control/rr-variability-semantic.test.mjs
          scripts/control/http-route-error-log-minimization.test.mjs
          scripts/control/tag-external-partner-rfq.test.mjs
          scripts/control/tag-feasibility.test.mjs
          scripts/control/wqi-rsi-authority.test.mjs
      - name: Enforce upload/webhook activation boundary (#214)
        run: node --test scripts/control/http-upload-webhook-activation.test.mjs
      - name: Enforce PostgreSQL runtime least-privilege boundary (#214)
        run: node --test scripts/control/database-least-privilege.test.mjs
      - name: Enforce PostgreSQL CI trigger coverage
        run: node --test scripts/control/p0-db-trigger-coverage.test.mjs
      - name: Enforce production release + DB migration authority (#831)
        run: node --test scripts/control/production-release-authority.test.mjs
      - name: Enforce UPenn meeting-pack claim boundary (C-BARQ / Penn / ELI, #617)
        run: node --test scripts/control/upenn-meeting-claims.test.mjs
      - name: Enforce INT-08 product and science documentation authorities
        run: node --test scripts/docs/verify-int08-authorities.test.mjs
      - name: Enforce TAG ERC/schematic source-coherence checker
        run: pnpm hardware:tag-source-coherence:test
      - name: Enforce single InferenceResult authority (ELI-ARCH-G2, #118)
        run: pnpm control:eli-contract:test
      - name: Enforce ELI surface classification authority (ELI-ARCH-G1, #118)
        run: node --test scripts/control/eli-surface-authority.test.mjs
      - name: Enforce ELI runtime conformance non-activation (#479)
        run: pnpm control:eli-runtime-conformance:test
      - name: Enforce ELI public projection firewall (#118/#124)
        run: node --test scripts/control/eli-publication-firewall.test.mjs
      - name: Enforce Device Trust fail-closed command/claim/OTA boundary (#66)
        run: node --test scripts/control/device-trust-boundary.test.mjs
      - name: Enforce Device Trust identity/PoP architecture gate (#648)
        run: node --test scripts/control/device-identity-pop-authority.test.mjs
      - name: Enforce Device Trust PoP challenge contract (#648)
        run: node --test scripts/control/device-pop-challenge-contract.test.mjs
      - name: Enforce Device Trust threat/provisioning boundary (#648)
        run: node --test scripts/control/device-identity-threat-model.test.mjs
      - name: Enforce ELI activity-feature IO boundary (#122)
        run: node --test scripts/control/eli-io-first-slice.test.mjs
      - name: Enforce proprietary BLE UUID authority (#625)
        run: node --test scripts/control/ble-uuid-authority.test.mjs
      - name: Enforce TAG NCS platform scaffold authority (#625)
        run: node --test scripts/control/tag-ncs-platform.test.mjs
      - name: Enforce BOOT_ANCHOR_V1 mobile capture authority (#635)
        run: node --test scripts/control/boot-anchor-v1.test.mjs
      - name: Enforce MS88SF3 G2 board-authority gate (#625)
        run: node --test scripts/control/tag-ms88sf3-board-authority.test.mjs
      - name: Enforce rr_variability window reachability (#86)
        run: |
          pnpm science:rr-audit
          pnpm science:rr-audit:test
      - name: Validate mobile native BLE plugin resolution (#122)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: pnpm --filter @emopet/mobile exec expo config --type prebuild > /tmp/emopet-mobile-prebuild-config.txt
      - name: Typecheck workspace
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Run workspace tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Enforce ELI canonical device-registry boundary (#122)
        run: node --test scripts/control/eli-io-device-registry.test.mjs
      - name: Enforce ELI mobile network-client fail-closed boundary (#122)
        run: node --test apps/mobile/test/activity-feature-network-contract.test.mjs
      - name: Enforce ELI feature transport-to-envelope conformance (#122)
        run: |
          pnpm turbo run build --filter=@emopet/ble-protocol --filter=@emopet/api
          node --test scripts/control/eli-io-feature-transport-conformance.test.mjs
      - name: Enforce Device Trust C/backend PoP preimage parity (#648)
        run: |
          cc --version
          node --test scripts/control/device-pop-preimage-conformance.test.mjs
      - name: Enforce Device Trust PSA signer source boundary (#648)
        run: node --test scripts/control/device-pop-psa-signer.test.mjs
      - name: Enforce Device Trust private-key provisioning boundary (#657)
        run: node --test scripts/control/device-private-key-storage.test.mjs
      - name: Enforce Device Trust identity-key slot/enrollment boundary (#659)
        run: node --test scripts/control/device-identity-key-slots.test.mjs
      - name: Enforce AUTH email-verification activation boundary (#738)
        run: node --test scripts/control/auth-email-verification-authority.test.mjs
      - name: Enforce AUTH legacy verification census boundary (#760)
        run: node --test scripts/control/auth-email-legacy-rollout-audit.test.mjs
      - name: Enforce shared AUTH rate-limit boundary (#767)
        run: node --test scripts/control/auth-rate-limit-shared.test.mjs
      - name: Enforce Device Trust durable public credential boundary (#661)
        run: node --test scripts/control/device-credential-repository.test.mjs
      - name: Enforce Device Trust atomic credential activation gate (#720)
        run: node --test scripts/control/device-credential-activation-gate.test.mjs
      - name: Enforce PRIV-SEC G5 detection runtime boundary (#525)
        run: node --test scripts/control/security-detection-runtime.test.mjs
      - name: Enforce PRIV-SEC G5 event coverage authority (#525)
        run: node --test scripts/control/security-detection-coverage.test.mjs
      - name: Enforce TAG firmware feature-writer parity (#122)
        run: |
          cc --version
          node --test scripts/control/tag-feature-summary-firmware-conformance.test.mjs
      - name: Enforce TAG clock-anchor C/TypeScript parity (#122)
        run: |
          pnpm turbo run build --filter=@emopet/ble-protocol
          cc --version
          node --test scripts/control/tag-clock-anchor-conformance.test.mjs
      - name: Build web application
        id: webbuild
        shell: bash
        run: |
          set +e
          # Execute the same web build graph through Turbo so unchanged inputs can
          # replay deterministic build outputs from the cache restored above.
          pnpm turbo run build --filter=@emopet/web... > web-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-remediation-regression-logs
          path: |
            typecheck.log
            tests.log
            web-build.log
          if-no-files-found: error
      - name: Enforce regression gate
        if: always()
        env:
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TESTS_EXIT: ${{ steps.tests.outputs.exit_code }}
          WEBBUILD_EXIT: ${{ steps.webbuild.outputs.exit_code }}
        shell: bash
        run: |
          test "$TYPECHECK_EXIT" -eq 0
          test "$TESTS_EXIT" -eq 0
          test "$WEBBUILD_EXIT" -eq 0

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.175.0'
      - name: Run security static analysis
        id: semgrep
        shell: bash
        run: |
          set +e
          semgrep scan --config p/ci --error --metrics=off --json --output semgrep.json .
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-findings
          path: semgrep.json
          if-no-files-found: error
      - name: Enforce Semgrep gate
        if: always()
        env:
          SEMGREP_EXIT: ${{ steps.semgrep.outputs.exit_code }}
        run: test "$SEMGREP_EXIT" -eq 0

  codeql:
    # GitHub default setup owns analysis and SARIF upload. This repository job
    # verifies the managed run for the exact PR head instead of submitting a
    # competing advanced-configuration SARIF payload.
    name: CodeQL default setup evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Test CodeQL evidence gate
        run: node --test scripts/security/verify-codeql-default-setup.test.mjs
      - name: Require successful GitHub CodeQL analysis, upload and alert inventory for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEQL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEQL_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CODEQL_REF: ${{ github.ref }}
        run: node scripts/security/verify-codeql-default-setup.mjs
      - name: Preserve verified CodeQL run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-default-setup-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: codeql-default-setup-evidence.json
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Generate CycloneDX/SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emopet-sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance-note:
    name: Release provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert release signing policy exists
        run: test -f docs/security/SUPPLY_CHAIN_SECURITY.md
name: Security supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Regenerate candidate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Audit dependencies and preserve machine-readable evidence
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=high --json > pnpm-audit.json
          set -e
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error
      - name: Enforce high/critical dependency gate
        if: always()
        run: node tools/security/evaluate-pnpm-audit.mjs pnpm-audit.json

  security-regression:
    name: Dependency remediation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspace
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Run workspace tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Build web application
        id: webbuild
        shell: bash
        run: |
          set +e
          pnpm --filter @emopet/web build > web-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-regression-logs
          path: |
            typecheck.log
            tests.log
            web-build.log
          if-no-files-found: error
      - name: Enforce regression gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.typecheck.outputs.exit_code }}" -eq 0
          test "${{ steps.tests.outputs.exit_code }}" -eq 0
          test "${{ steps.webbuild.outputs.exit_code }}" -eq 0

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.175.0'
      - name: Run security static analysis
        id: semgrep
        shell: bash
        run: |
          set +e
          semgrep scan --config p/ci --error --metrics=off --json --output semgrep.json .
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep.json
          if-no-files-found: error
      - name: Enforce Semgrep gate
        if: always()
        run: test "${{ steps.semgrep.outputs.exit_code }}" -eq 0

  codeql:
    name: CodeQL JavaScript/TypeScript (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  sbom:
    name: Generate CycloneDX/SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: emopet-sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance-note:
    name: Release provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert release signing policy exists
        run: test -f docs/security/SUPPLY_CHAIN_SECURITY.md

name: Security supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: pnpm
      - name: Install exact locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies and preserve machine-readable evidence
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=high --json > pnpm-audit.json
          set -e
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error
      - name: Enforce high/critical dependency gate
        if: always()
        run: node tools/security/evaluate-pnpm-audit.mjs pnpm-audit.json

  security-regression:
    name: Dependency remediation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce legacy freemium quarantine gate
        run: pnpm legacy-freemium:audit
      # Static, read-only repository guards. A PASS is not rights clearance,
      # scientific validation or runtime activation; each guard pins one
      # boundary that has already drifted or regressed once. See #114, #116,
      # #118 and #86.
      - name: Enforce control-register pointers (#114, #116)
        run: |
          pnpm control:pointer-audit
          pnpm control:pointer-audit:test
      - name: Enforce single InferenceResult authority (ELI-ARCH-G2, #118)
        run: pnpm control:eli-contract:test
      - name: Enforce rr_variability window reachability (#86)
        run: |
          pnpm science:rr-audit
          pnpm science:rr-audit:test
      - name: Typecheck workspace
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Run workspace tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Build web application
        id: webbuild
        shell: bash
        run: |
          set +e
          pnpm --filter @emopet/web build > web-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-remediation-regression-logs
          path: |
            typecheck.log
            tests.log
            web-build.log
          if-no-files-found: error
      - name: Enforce regression gate
        if: always()
        env:
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TESTS_EXIT: ${{ steps.tests.outputs.exit_code }}
          WEBBUILD_EXIT: ${{ steps.webbuild.outputs.exit_code }}
        shell: bash
        run: |
          test "$TYPECHECK_EXIT" -eq 0
          test "$TESTS_EXIT" -eq 0
          test "$WEBBUILD_EXIT" -eq 0

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.175.0'
      - name: Run security static analysis
        id: semgrep
        shell: bash
        run: |
          set +e
          semgrep scan --config p/ci --error --metrics=off --json --output semgrep.json .
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-findings
          path: semgrep.json
          if-no-files-found: error
      - name: Enforce Semgrep gate
        if: always()
        env:
          SEMGREP_EXIT: ${{ steps.semgrep.outputs.exit_code }}
        run: test "$SEMGREP_EXIT" -eq 0

  codeql:
    # GitHub default setup owns analysis and SARIF upload. This repository job
    # verifies the managed run for the exact PR head instead of submitting a
    # competing advanced-configuration SARIF payload.
    name: CodeQL default setup evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Test CodeQL evidence gate
        run: node --test scripts/security/verify-codeql-default-setup.test.mjs
      - name: Require successful GitHub CodeQL analysis, upload and alert inventory for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEQL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CODEQL_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CODEQL_REF: ${{ github.ref }}
        run: node scripts/security/verify-codeql-default-setup.mjs
      - name: Preserve verified CodeQL run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-default-setup-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: codeql-default-setup-evidence.json
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Generate CycloneDX/SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emopet-sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance-note:
    name: Release provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert release signing policy exists
        run: test -f docs/security/SUPPLY_CHAIN_SECURITY.md
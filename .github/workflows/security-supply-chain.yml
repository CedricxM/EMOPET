name: Security supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install exact locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies and preserve machine-readable evidence
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=high --json > pnpm-audit.json
          set -e
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error
      - name: Enforce high/critical dependency gate
        if: always()
        run: node tools/security/evaluate-pnpm-audit.mjs pnpm-audit.json

  security-regression:
    name: Dependency remediation regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Run workspace tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test > tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Build web application
        id: webbuild
        shell: bash
        run: |
          set +e
          pnpm --filter @emopet/web build > web-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-remediation-regression-logs
          path: |
            typecheck.log
            tests.log
            web-build.log
          if-no-files-found: error
      - name: Enforce regression gate
        if: always()
        env:
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          TESTS_EXIT: ${{ steps.tests.outputs.exit_code }}
          WEBBUILD_EXIT: ${{ steps.webbuild.outputs.exit_code }}
        shell: bash
        run: |
          test "$TYPECHECK_EXIT" -eq 0
          test "$TESTS_EXIT" -eq 0
          test "$WEBBUILD_EXIT" -eq 0

  authority-gates:
    name: Rights + professional sharing authority gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install exact locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Enforce third-party data rights gate
        run: pnpm rights:audit
      - name: Enforce professional sharing authority gate
        run: pnpm professional-share:audit

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.175.0'
      - name: Run security static analysis
        id: semgrep
        shell: bash
        run: |
          set +e
          semgrep scan --config p/ci --error --metrics=off --json --output semgrep.json .
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-findings
          path: semgrep.json
          if-no-files-found: error
      - name: Enforce Semgrep gate
        if: always()
        env:
          SEMGREP_EXIT: ${{ steps.semgrep.outputs.exit_code }}
        run: test "$SEMGREP_EXIT" -eq 0

  codeql:
    name: CodeQL JavaScript/TypeScript (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  sbom:
    name: Generate CycloneDX/SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emopet-sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance-note:
    name: Release provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert release signing policy exists
        run: test -f docs/security/SUPPLY_CHAIN_SECURITY.md

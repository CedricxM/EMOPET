name: Windows portability

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/windows-portability.yml'
      - 'scripts/**'
      - 'apps/web/lib/server/**'
      - 'apps/web/scripts/run-tests.mjs'
      - 'backend/api/privacy/**'
      - 'backend/api/services/instrument-*.ts'
      - 'backend/test/instrument-sensor-embargo.test.mjs'
      - 'data/vbo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/windows-portability.yml'
      - 'scripts/**'
      - 'apps/web/lib/server/**'
      - 'apps/web/scripts/run-tests.mjs'
      - 'backend/api/privacy/**'
      - 'backend/api/services/instrument-*.ts'
      - 'backend/test/instrument-sensor-embargo.test.mjs'
      - 'data/vbo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

# For pull requests, keep only the newest run for this workflow.
# Pushes to main and manual runs remain non-cancelling evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: pnpm

      - name: Restore Turbo and Next build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: emopet-windows-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            emopet-windows-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install exact locked dependency graph
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify checkout attributes
        shell: pwsh
        run: |
          $generated = git check-attr eol -- backend/api/privacy/breach-recipient-surfaces.generated.ts
          if ($generated -notmatch 'eol: lf') {
            throw "Generated TypeScript is not forced to LF: $generated"
          }

          $vbo = git check-attr text -- data/vbo/vbo.json
          if ($vbo -notmatch 'text: unset') {
            throw "VBO snapshot is not byte-exact (-text): $vbo"
          }

      - name: Run Windows-sensitive root guards
        run: >
          node --test
          scripts/control/control-register-pointer-audit.test.mjs
          scripts/control/eli-result-contract.test.mjs
          scripts/hardware/tag-source-coherence.test.mjs
          scripts/security/summarize-pnpm-licenses.test.mjs

      - name: Build backend for C-BARQ G9 guard
        run: |
          pnpm --filter '@emopet/api^...' build
          pnpm --filter @emopet/api build

      - name: Run C-BARQ G9 sensor embargo guard on Windows
        working-directory: backend
        run: node --test test/instrument-sensor-embargo.test.mjs

      - name: Verify generated privacy catalogue stays byte-stable
        run: node scripts/privacy/generate-breach-recipient-surfaces.mjs --check

      - name: Verify VBO committed snapshot bytes
        run: node scripts/data/vbo-committed-snapshot-audit.mjs

      - name: Run web tests on Windows with workspace build dependencies
        run: pnpm turbo run test --filter=@emopet/web

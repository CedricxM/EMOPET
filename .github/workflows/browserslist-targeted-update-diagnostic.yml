name: One-shot browserslist targeted update diagnostic

on:
  push:
    branches:
      - fix/security-browserslist-4-28-7

permissions:
  contents: read

jobs:
  targeted-update-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/security-browserslist-4-28-7

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Enable exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          test "$(pnpm --version)" = "10.33.0"

      - name: Target only the transitive browserslist selector
        run: |
          cp pnpm-lock.yaml /tmp/pnpm-lock.yaml.controlled
          trap 'cp /tmp/pnpm-lock.yaml.controlled pnpm-lock.yaml' EXIT
          pnpm update -r browserslist@4.28.7 --depth Infinity --lockfile-only --no-save

      - name: Inspect proposed lock churn
        run: |
          grep -q "browserslist@4.28.7" pnpm-lock.yaml
          echo '--- lock diff stat ---'
          git diff --stat -- pnpm-lock.yaml
          echo '--- changed package keys (max 200) ---'
          git diff -U0 -- pnpm-lock.yaml | grep -E '^[+-]  [^ ]+@[^:]+:' | head -200 || true
          echo '--- browserslist-family lines ---'
          git diff -U1 -- pnpm-lock.yaml | grep -E '^[+-].*(browserslist|baseline-browser-mapping|caniuse-lite|electron-to-chromium|node-releases|update-browserslist-db)' || true

name: P0 DB authority parity

on:
  pull_request:
    paths:
      - 'backend/db/**'
      - 'backend/test/critical-schema-fingerprint.sql'
      - 'backend/test/dataset-operational-fingerprint.sql'
      - 'scripts/ingest_vbo.ts'
      - 'data/vbo/breed_canonical_insert.sql'
      - 'data/vbo/breed_canonical_insert.legacy.sql'
      - 'data/vbo/README.md'
      - '.github/workflows/p0-db-authority-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-schema-parity:
    name: Historical SQL vs fresh Drizzle critical schema parity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: emopet_qa_only
      HISTORICAL_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_parity_historical
      GENERATED_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_parity_generated

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build historical SQL authority
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_parity_historical

          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$HISTORICAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$HISTORICAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Build backend dependency closure
        run: pnpm --filter @emopet/api... build

      - name: Generate fresh Drizzle authority
        working-directory: backend
        run: |
          rm -rf db/p0-generated-baseline
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_authority_parity
          test "$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 1

      - name: Apply fresh Drizzle authority
        run: |
          createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_parity_generated
          cd backend
          DATABASE_URL="$GENERATED_DATABASE_URL" pnpm exec drizzle-kit migrate --config=db/drizzle.p0-baseline.config.ts

      - name: Require writer-owned VBO updated_at contract
        run: |
          grep -Fq "updated_at = NOW()" scripts/ingest_vbo.ts
          test -f data/vbo/breed_canonical_insert.legacy.sql

          if grep -Fq "RAISE EXCEPTION" data/vbo/breed_canonical_insert.sql \
            && grep -Fq "ingest_vbo.ts" data/vbo/breed_canonical_insert.sql; then
            echo "Checked-in VBO SQL path is an intentional fail-closed regeneration guard."
          elif grep -Fq "updated_at = NOW()" data/vbo/breed_canonical_insert.sql; then
            echo "Current generated VBO SQL owns updated_at."
          else
            echo "VBO SQL artifact is stale and executable without writer-owned updated_at." >&2
            exit 1
          fi

      - name: Capture critical semantic fingerprints
        run: |
          psql "$HISTORICAL_DATABASE_URL" -At -v ON_ERROR_STOP=1 -f backend/test/critical-schema-fingerprint.sql > /tmp/critical-historical.txt
          psql "$HISTORICAL_DATABASE_URL" -At -v ON_ERROR_STOP=1 -f backend/test/dataset-operational-fingerprint.sql >> /tmp/critical-historical.txt
          psql "$GENERATED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -f backend/test/critical-schema-fingerprint.sql > /tmp/critical-generated.txt
          psql "$GENERATED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -f backend/test/dataset-operational-fingerprint.sql >> /tmp/critical-generated.txt

          echo '--- historical critical fingerprint ---'
          cat /tmp/critical-historical.txt
          echo '--- fresh Drizzle critical fingerprint ---'
          cat /tmp/critical-generated.txt

      - name: Require critical schema authority parity
        run: diff -u /tmp/critical-historical.txt /tmp/critical-generated.txt

      - name: Maturity boundary
        if: always()
        run: |
          echo 'This workflow compares selected critical identity/provenance, ELI, dataset schema, and selected dataset operational authority semantics between checked-in historical migrations and a fresh current Drizzle authority.'
          echo 'It is intentionally not a claim that every non-critical table, constraint name, storage parameter, data snapshot, or production extension is identical.'
          echo 'It does not authorize production migration or release.'

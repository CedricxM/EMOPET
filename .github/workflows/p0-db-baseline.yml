name: P0 DB baseline validation

on:
  pull_request:
    paths:
      - 'backend/db/**'
      - 'backend/api/services/subject-access.ts'
      - 'backend/api/services/subject-discovery.ts'
      - 'backend/api/routes/data-export.ts'
      - 'backend/test/migration-baseline-static.test.mjs'
      - 'backend/test/subject-discovery-postgres.test.mjs'
      - '.github/workflows/p0-db-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-postgres:
    name: Static + disposable PostgreSQL QA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: emopet_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d emopet_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa
      PGPASSWORD: emopet_qa_only
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Repository-only migration checks
        working-directory: backend
        run: node --test test/migration-baseline-static.test.mjs

      - name: Apply all draft prerequisites in order
        run: |
          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply historical migrations in order
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0001_dataset_registry.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0002_freemium_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0003_architecture_upgrade.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0004_v6_additions.sql

      - name: Capture first schema
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" > /tmp/schema-a.sql
          psql "$DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-a.txt
          cat /tmp/tables-a.txt

      - name: Create second disposable database
        run: createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_qa_repeat

      - name: Repeat complete apply on second database
        env:
          REPEAT_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_repeat
        run: |
          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0001_dataset_registry.sql
          psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0002_freemium_foundation.sql
          psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0003_architecture_upgrade.sql
          psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/migrations/0004_v6_additions.sql
          pg_dump --schema-only --no-owner --no-privileges "$REPEAT_DATABASE_URL" > /tmp/schema-b.sql
          psql "$REPEAT_DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-b.txt

      - name: Repeatability — table inventory
        run: diff -u /tmp/tables-a.txt /tmp/tables-b.txt

      - name: Normalize pg_dump session guards
        run: |
          sed -i '/^\\restrict /d;/^\\unrestrict /d' /tmp/schema-a.sql
          sed -i '/^\\restrict /d;/^\\unrestrict /d' /tmp/schema-b.sql

      - name: Repeatability — complete schema dump
        run: diff -u /tmp/schema-a.sql /tmp/schema-b.sql

      - name: Build backend dependency closure
        run: pnpm --filter @emopet/api... build

      - name: PRIV-DISC-01 read-only subject discovery on draft baseline
        working-directory: backend
        env:
          SUBJECT_DISCOVERY_DB_INTEGRATION: '1'
        run: node --test test/subject-discovery-postgres.test.mjs

      - name: Generate isolated Drizzle fresh baseline
        working-directory: backend
        run: |
          rm -rf db/p0-generated-baseline
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_fresh_baseline
          test -f db/p0-generated-baseline/meta/_journal.json
          test "$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 1
          echo '--- generated journal ---'
          cat db/p0-generated-baseline/meta/_journal.json
          echo '--- generated SQL ---'
          cat db/p0-generated-baseline/*.sql

      - name: Check generated Drizzle ledger
        working-directory: backend
        run: pnpm exec drizzle-kit check --config=db/drizzle.p0-baseline.config.ts

      - name: Create generated-baseline disposable database
        run: createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_qa_generated

      - name: Apply generated Drizzle baseline with migrate
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: pnpm exec drizzle-kit migrate --config=db/drizzle.p0-baseline.config.ts

      - name: Verify generated table inventory
        env:
          GENERATED_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: |
          psql "$GENERATED_DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-generated.txt
          diff -u /tmp/tables-a.txt /tmp/tables-generated.txt

      - name: PRIV-DISC-01 read-only subject discovery on generated baseline
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          SUBJECT_DISCOVERY_DB_INTEGRATION: '1'
        run: node --test test/subject-discovery-postgres.test.mjs

      - name: Verify generated snapshot is stable
        working-directory: backend
        run: |
          before="$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)"
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_second_generation_check
          after="$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$before" -eq "$after"

      - name: Upload generated Drizzle baseline QA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-generated-drizzle-baseline
          path: backend/db/p0-generated-baseline
          if-no-files-found: error
          retention-days: 7

      - name: Backend typecheck
        run: pnpm --filter @emopet/api typecheck

      - name: Backend tests
        run: pnpm --filter @emopet/api test

      - name: Maturity boundary
        if: always()
        run: |
          echo 'This workflow validates only disposable P0 database behavior.'
          echo 'PRIV-DISC-01 subject discovery is read-only and does not authorize erasure.'
          echo 'It does not authorize production migration, deployment, or release.'

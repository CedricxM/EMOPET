name: P0 DB baseline validation

on:
  pull_request:
    paths:
      - 'backend/db/**'
      - 'backend/api/routes/auth.ts'
      - 'backend/api/middleware/auth.ts'
      - 'backend/api/services/auth-*.ts'
      - 'backend/test/auth-*.test.mjs'
      - 'backend/api/routes/dogs.ts'
      - 'backend/api/routes/health.ts'
      - 'backend/api/routes/sensors.ts'
      - 'packages/shared/src/validators/index.ts'
      - 'backend/api/routes/data-export.ts'
      - 'backend/api/routes/community.ts'
      - 'backend/test/community-*.test.mjs'
      - 'backend/api/services/community-*.ts'
      - 'backend/api/routes/directory.ts'
      - 'backend/test/*.integration.test.mjs'
      - 'backend/api/services/*retention*.ts'
      - 'backend/test/*retention*.test.mjs'
      - 'backend/api/services/ai-zero-durable-retention-readiness.ts'
      - 'backend/test/ai-zero-durable-retention-readiness.test.mjs'
      - 'backend/api/services/moderation-retention-readiness.ts'
      - 'backend/test/moderation-retention-readiness.test.mjs'
      - 'backend/test/migration-baseline-static.test.mjs'
      - 'backend/test/id-01-referential-integrity.sql'
      - 'backend/test/copresence-identity-fingerprint.sql'
      - 'backend/test/subject-discovery-postgres.test.mjs'
      - 'backend/test/privacy-erasure-topology.integration.test.mjs'
      - 'backend/test/privacy-erasure-residue-verification.integration.test.mjs'
      - 'backend/api/services/erasure-residue-verification.ts'
      - 'config/privacy/**'
      - 'backend/api/services/subject-discovery.ts'
      - 'backend/api/services/subject-access.ts'
      - 'backend/api/services/data-export-policy.ts'
      - 'backend/test/data-export-*.test.mjs'
      - 'backend/test/privacy-dog-export-coverage.test.mjs'
      - 'config/privacy/dog-export-coverage.json'
      - 'backend/api/services/professional-share-*.ts'
      - 'backend/test/professional-share-*.test.mjs'
      - 'packages/shared/src/types/professional-share.ts'
      - 'packages/shared/src/validators/professional-share.ts'
      - 'scripts/security/professional-share-authority-audit.mjs'
      - 'backend/test/dataset-writer-authority.sql'
      - 'scripts/ingest_vbo.ts'
      - 'scripts/data/vbo-committed-snapshot-audit.mjs'
      - 'data/vbo/**'
      - '.github/workflows/p0-db-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-postgres:
    name: Static + disposable PostgreSQL QA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emopet_qa
          POSTGRES_PASSWORD: emopet_qa_only
          POSTGRES_DB: emopet_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emopet_qa -d emopet_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa
      PGPASSWORD: emopet_qa_only
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Repository-only migration checks
        working-directory: backend
        run: |
          node --test test/migration-baseline-static.test.mjs
          node --test test/behavioral-assessment-context-static.test.mjs

      - name: Apply all draft prerequisites in order
        run: |
          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply historical migrations in order
        run: |
          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: ELI-BEHAV-01 mapping authority on historical migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa
          BEHAVIORAL_ELI_MAPPING_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/behavioral-eli-mapping-authority.integration.test.mjs

      - name: Capture first schema
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" > /tmp/schema-a.sql
          psql "$DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-a.txt
          cat /tmp/tables-a.txt

      - name: Create second disposable database
        run: createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_qa_repeat

      - name: Repeat complete apply on second database
        env:
          REPEAT_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_repeat
        run: |
          for file in $(find backend/db/baseline-draft -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          for file in $(find backend/db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$REPEAT_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          pg_dump --schema-only --no-owner --no-privileges "$REPEAT_DATABASE_URL" > /tmp/schema-b.sql
          psql "$REPEAT_DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-b.txt

      - name: Repeatability — table inventory
        run: diff -u /tmp/tables-a.txt /tmp/tables-b.txt

      - name: Normalize pg_dump session guards
        run: |
          sed -i '/^\\restrict /d;/^\\unrestrict /d' /tmp/schema-a.sql
          sed -i '/^\\restrict /d;/^\\unrestrict /d' /tmp/schema-b.sql

      - name: Repeatability — complete schema dump
        run: diff -u /tmp/schema-a.sql /tmp/schema-b.sql

      - name: PRIV-RETENTION device unbind clock on historical migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa
          DEVICE_UNBIND_RETENTION_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/device-unbind-retention-clock.integration.test.mjs

      - name: Build backend dependency closure
        run: pnpm --filter @emopet/api... build

      - name: BEHAV-DATA-01 semantics on historical migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa
          EMOPET_DB_INTEGRATION_TEST: '1'
          NODE_ENV: test
        run: node --test test/behavioral-assessment-context.integration.test.mjs

      - name: Generate isolated Drizzle fresh baseline
        working-directory: backend
        run: |
          rm -rf db/p0-generated-baseline
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_fresh_baseline
          test -f db/p0-generated-baseline/meta/_journal.json
          test "$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 1
          echo '--- generated journal ---'
          cat db/p0-generated-baseline/meta/_journal.json
          echo '--- generated SQL ---'
          cat db/p0-generated-baseline/*.sql

      - name: Check generated Drizzle ledger
        working-directory: backend
        run: pnpm exec drizzle-kit check --config=db/drizzle.p0-baseline.config.ts

      - name: Create generated-baseline disposable database
        run: createdb -h 127.0.0.1 -p 5432 -U emopet_qa emopet_qa_generated

      - name: Apply generated Drizzle baseline with migrate
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: pnpm exec drizzle-kit migrate --config=db/drizzle.p0-baseline.config.ts

      # Drizzle emits table/column constraints but not PostgreSQL trigger/function authority.
      - name: Apply ELI-BEHAV non-Drizzle authority objects
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0015_behavioral_eli_mapping_authority.sql

      - name: ELI-BEHAV-01 mapping authority on generated baseline
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          BEHAVIORAL_ELI_MAPPING_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/behavioral-eli-mapping-authority.integration.test.mjs

      - name: BEHAV-DATA-01 semantics on generated baseline
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EMOPET_DB_INTEGRATION_TEST: '1'
          NODE_ENV: test
        run: node --test test/behavioral-assessment-context.integration.test.mjs

      - name: ID-01 canonical identity and FK checks
        env:
          GENERATED_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: psql "$GENERATED_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/id-01-referential-integrity.sql

      - name: PRIV-RETENTION AI zero-durable negative evidence
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          AI_ZERO_DURABLE_RETENTION_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/ai-zero-durable-retention-readiness.integration.test.mjs

      - name: PRIV-RETENTION exact-location max-window readiness
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EXACT_LOCATION_RETENTION_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/exact-location-retention-readiness.integration.test.mjs

      - name: PRIV-RETENTION detailed sensor + ELI 36-month readiness
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          DETAILED_SENSOR_ELI_RETENTION_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/detailed-sensor-eli-retention-readiness.integration.test.mjs

      - name: PRIV-RETENTION UTC calendar expiry parity
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          RETENTION_CALENDAR_PARITY_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/privacy-retention-calendar-parity.integration.test.mjs

      - name: PRIV-RETENTION moderation evidence 12-month readiness
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          MODERATION_RETENTION_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/moderation-retention-readiness.integration.test.mjs

      - name: PRIV-RETENTION aggregate execution plan dry-run
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          RETENTION_EXECUTION_PLAN_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/retention-execution-plan.integration.test.mjs

      - name: INT-03B VBO writer and traceability contract
        run: |
          grep -Fq "updated_at = NOW()" scripts/ingest_vbo.ts
          grep -Fq "RAISE EXCEPTION" data/vbo/breed_canonical_insert.sql
          node scripts/data/vbo-committed-snapshot-audit.mjs

      - name: INT-03B writer-owned dataset timestamp
        env:
          GENERATED_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: psql "$GENERATED_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/dataset-writer-authority.sql

      - name: Verify generated table inventory
        env:
          GENERATED_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: |
          psql "$GENERATED_DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/tables-generated.txt
          diff -u /tmp/tables-a.txt /tmp/tables-generated.txt

      - name: AUTH-01 route integration on generated baseline
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          AUTH_DB_INTEGRATION: '1'
          EMOPET_DB_INTEGRATION_TEST: '0'
        run: node --test test/auth-routes-postgres.test.mjs test/auth-session-concurrency.test.mjs

      - name: PRIV-RETENTION refresh-session expiry readiness
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          AUTH_RETENTION_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/auth-session-retention-readiness.integration.test.mjs

      - name: INT-03A sensor-summary provenance integration
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EMOPET_DB_INTEGRATION_TEST: '1'
        run: node --test test/sensor-summary-ingestion.integration.test.mjs test/sensor-ingestion-authority-concurrency.integration.test.mjs

      - name: INT-06F canonical copresence dog identity
        env:
          GENERATED_DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
        run: |
          psql "$GENERATED_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/test/copresence-identity-fingerprint.sql | tee /tmp/copresence-fingerprint.txt
          grep -Fq 'COPRESENCE_FK|dog_a_id|dogs|id|a' /tmp/copresence-fingerprint.txt
          grep -Fq 'COPRESENCE_FK|dog_b_id|dogs|id|a' /tmp/copresence-fingerprint.txt

      - name: INT-06 durable Community core
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EMOPET_DB_INTEGRATION_TEST: '1'
        run: |
          node --test \
            test/community-persistence.integration.test.mjs \
            test/community-feed.integration.test.mjs \
            test/community-authority-concurrency.integration.test.mjs \
            test/community-disclosure.integration.test.mjs

      - name: Health journal durable integration
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EMOPET_DB_INTEGRATION_TEST: '1'
        run: node --test test/health-entries.integration.test.mjs

      - name: PRIV-DISC-01 transactional subject discovery
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          SUBJECT_DISCOVERY_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/subject-discovery-postgres.test.mjs test/community-subject-discovery.integration.test.mjs

      - name: PRIV-ERASURE-TOPOLOGY generated database parity
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          PRIVACY_ERASURE_TOPOLOGY_DB_INTEGRATION: '1'
        run: node --test test/privacy-erasure-topology.integration.test.mjs

      - name: PRIV-ERASURE-RESIDUE snapshot + negative SQL verification
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          ERASURE_RESIDUE_DB_INTEGRATION: '1'
          NODE_ENV: test
        run: node --test test/privacy-erasure-residue-verification.integration.test.mjs

      - name: INT-04A bounded Owner export authority
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EMOPET_DB_INTEGRATION_TEST: '1'
        run: |
          node --test \
            test/data-export-authority.test.mjs \
            test/data-export-interval-contract.test.mjs \
            test/data-export-summary-window.test.mjs \
            test/privacy-dog-export-coverage.test.mjs \
            test/data-export-runtime.integration.test.mjs

      - name: INT-05 backend authority guard
        run: node scripts/security/professional-share-authority-audit.mjs

      - name: INT-05 recipient-bound professional sharing
        working-directory: backend
        env:
          DATABASE_URL: postgres://emopet_qa:emopet_qa_only@127.0.0.1:5432/emopet_qa_generated
          EMOPET_DB_INTEGRATION_TEST: '1'
        run: node --test test/professional-share-*.test.mjs

      - name: Verify generated snapshot is stable
        working-directory: backend
        run: |
          before="$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)"
          pnpm exec drizzle-kit generate --config=db/drizzle.p0-baseline.config.ts --name=p0_second_generation_check
          after="$(find db/p0-generated-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$before" -eq "$after"

      - name: Upload generated Drizzle baseline QA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-generated-drizzle-baseline
          path: backend/db/p0-generated-baseline
          if-no-files-found: error
          retention-days: 7

      - name: Backend typecheck
        run: pnpm --filter @emopet/api typecheck

      - name: Backend tests
        run: pnpm --filter @emopet/api test

      - name: Maturity boundary
        if: always()
        run: |
          echo 'This workflow validates disposable P0 database behavior plus focused AUTH-01, ID-01, INT-03A/03B, INT-06 durable Community core + copresence identity, durable Health journal create/read, BEHAV-DATA-01 response/applicability semantics, PRIV-DISC-01, PRIV-ERASURE-TOPOLOGY, read-only PRIV-ERASURE-RESIDUE verification, retention-readiness probes, INT-04A bounded export authority, and INT-05 recipient-bound professional sharing.'
          echo 'It does not authorize production migration, deployment, or release.'
